# Mounts three Key Vault secrets and mirrors them into a Kubernetes Secret named paktech-chat-secrets.
# The Secret exists only while at least one pod that mounts the volume is running.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: paktech-chat-kv
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    clientID: {{ .Values.azure.workloadIdentityClientId | quote }}
    keyvaultName: {{ .Values.azure.keyVaultName }}
    tenantId: {{ .Values.azure.tenantId }}
    objects: |
      array:
        - |
          objectName: {{ .Values.azure.secretPrefix }}-secret-key
          objectType: secret
        - |
          objectName: {{ .Values.azure.secretPrefix }}-postgres-password
          objectType: secret
{{- if .Values.ai.enabled }}
        - |
          objectName: {{ .Values.azure.secretPrefix }}-anthropic-api-key
          objectType: secret
{{- end }}
  secretObjects:
    - secretName: paktech-chat-secrets
      type: Opaque
      data:
        - {objectName: {{ .Values.azure.secretPrefix }}-secret-key, key: SECRET_KEY}
        - {objectName: {{ .Values.azure.secretPrefix }}-postgres-password, key: POSTGRES_PASSWORD}
{{- if .Values.ai.enabled }}
        - {objectName: {{ .Values.azure.secretPrefix }}-anthropic-api-key, key: ANTHROPIC_API_KEY}
{{- end }}
