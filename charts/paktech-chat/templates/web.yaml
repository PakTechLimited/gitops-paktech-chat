apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  selector: {app: web}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: web
          image: {{ .Values.image.registry }}/{{ .Values.image.web.repository }}:{{ .Values.image.web.tag }}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          {{- include "pc.containerSecurity" . | nindent 10 }}
