apiVersion: v1
kind: Service
metadata:
  name: web
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  selector: {app: web}
  ports: [{name: http, port: 3000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: {type: RuntimeDefault}
      {{- if .Values.hardening.disableTokenAutomount }}
      automountServiceAccountToken: false
      {{- end }}
      containers:
        - name: web
          image: {{ include "pc.image" (dict "root" . "name" "web") }}
          ports: [{name: http, containerPort: 3000}]
          readinessProbe:
            httpGet: {path: /, port: http}
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /, port: http}
            initialDelaySeconds: 10
            periodSeconds: 20
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
          {{- include "pc.containerSecurity" . | nindent 10 }}
          {{- if .Values.hardening.readOnlyRootFilesystem }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
            - {name: next-cache, mountPath: /app/.next/cache}   # Next.js image and fetch cache
          {{- end }}
      {{- if .Values.hardening.readOnlyRootFilesystem }}
      volumes:
        - {name: tmp, emptyDir: {sizeLimit: 64Mi}}
        - {name: next-cache, emptyDir: {sizeLimit: 128Mi}}
      {{- end }}
