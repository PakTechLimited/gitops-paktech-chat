# The name and namespace must match the federated credential created by Terraform
# (subject system:serviceaccount:paktech-chat-<env>:paktech-chat).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: paktech-chat
  annotations:
    azure.workload.identity/client-id: {{ .Values.azure.workloadIdentityClientId | quote }}
    argocd.argoproj.io/sync-wave: "-2"
  labels: {{- include "pc.labels" . | nindent 4 }}
