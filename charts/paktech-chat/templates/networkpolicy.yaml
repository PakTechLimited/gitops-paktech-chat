# Cilium enforces these. Rule of thumb: nothing may talk to anything unless a policy says so.
# (Egress is left open for now; Phase 5 restricts it.)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-web-and-api
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [web, api]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: envoy-gateway-system}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-web-to-api
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: {matchLabels: {app: web}}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-api-to-data
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  podSelector:
    matchExpressions:
      - {key: app, operator: In, values: [postgres, redis]}
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - {key: app, operator: In, values: [api, migrate]}
