{{- if .Values.metrics.enabled }}
# Phase 6: let Prometheus (monitoring namespace) scrape the api. Off by default; each environment turns it on.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-prometheus-to-api
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  podSelector:
    matchLabels: {app: api}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: monitoring}
          podSelector:
            matchLabels: {app.kubernetes.io/name: prometheus}
      ports:
        - {protocol: TCP, port: 8000}
---
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: api
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  selector:
    matchLabels: {app: api}
  podMetricsEndpoints:
    - {port: http, path: /metrics, interval: 30s}
{{- end }}
