# Attaches this environment to the shared Gateway in the edge namespace.
# /api and /ws go to the API (WebSocket upgrade is handled by Envoy), everything else to Next.js.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: paktech-chat
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "3"}
spec:
  parentRefs:
    - {name: paktech-gateway, namespace: edge, sectionName: {{ .Values.gatewayListener }}}
  hostnames: [{{ .Values.host | quote }}]
  rules:
    - matches:
        - path: {type: PathPrefix, value: /api}
        - path: {type: PathPrefix, value: /ws}
      backendRefs: [{name: api, port: 8000}]
    - matches:
        - path: {type: PathPrefix, value: /}
      backendRefs: [{name: web, port: 3000}]
