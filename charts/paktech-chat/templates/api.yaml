apiVersion: v1
kind: Service
metadata:
  name: api
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  selector: {app: api}
  ports: [{name: http, port: 8000, targetPort: http}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicas }}
  {{- end }}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api, azure.workload.identity/use: "true"}
    spec:
      enableServiceLinks: false
      serviceAccountName: paktech-chat
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        seccompProfile: {type: RuntimeDefault}
      terminationGracePeriodSeconds: 60     # lets open WebSockets close cleanly during a rollout
      containers:
        - name: api
          image: {{ .Values.image.registry }}/{{ .Values.image.api.repository }}:{{ .Values.image.api.tag }}
          ports: [{name: http, containerPort: 8000}]
          env:
            - {name: APP_ENV, value: production}
            - {name: COOKIE_SECURE, value: "true"}
            - {name: ALLOWED_ORIGINS, value: "https://{{ .Values.host }}"}
            - {name: POSTGRES_HOST, value: postgres}
            - {name: POSTGRES_DB, value: {{ .Values.config.postgresDb | quote }}}
            - {name: POSTGRES_USER, value: {{ .Values.config.postgresUser | quote }}}
            - {name: REDIS_HOST, value: redis}
            - {name: AI_MODEL, value: {{ .Values.config.aiModel | quote }}}
            - name: POSTGRES_PASSWORD
              valueFrom: {secretKeyRef: {name: paktech-chat-secrets, key: POSTGRES_PASSWORD}}
            - name: SECRET_KEY
              valueFrom: {secretKeyRef: {name: paktech-chat-secrets, key: SECRET_KEY}}
            {{- if .Values.ai.enabled }}
            - name: ANTHROPIC_API_KEY
              valueFrom: {secretKeyRef: {name: paktech-chat-secrets, key: ANTHROPIC_API_KEY}}
            {{- end }}
          readinessProbe:
            httpGet: {path: /api/v1/health, port: http}
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: {path: /api/v1/health, port: http}
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 5
          resources: {{- toYaml .Values.api.resources | nindent 12 }}
          {{- include "pc.containerSecurity" . | nindent 10 }}
          volumeMounts:
            - {name: secrets-store, mountPath: /mnt/secrets, readOnly: true}
      volumes:
        {{- include "pc.secretVolume" . | nindent 8 }}
---
{{- if .Values.api.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api
  labels: {{- include "pc.labels" . | nindent 4 }}
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: api}
  minReplicas: {{ .Values.api.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.api.autoscaling.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: {{ .Values.api.autoscaling.targetCPUUtilizationPercentage }}}
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
{{- end }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api
  annotations: {argocd.argoproj.io/sync-wave: "2"}
spec:
  maxUnavailable: 1
  selector:
    matchLabels: {app: api}
