# Defaults shared by every environment. environments/<env>/values.yaml overrides these.
env: dev                       # dev | staging | prod
host: dev.paktechlimited.chat  # public host name for this environment
gatewayListener: https-dev     # HTTPS listener on the shared Gateway (platform/edge/gateway.yaml)
ai:
  enabled: false               # true once <prefix>-anthropic-api-key exists in Key Vault

image:
  registry: paktechacr.azurecr.io
  api: {repository: paktech-chat-api, tag: "REPLACE_WITH_IMAGE_TAG"}
  web: {repository: paktech-chat-web, tag: "REPLACE_WITH_IMAGE_TAG"}

azure:
  tenantId: 90804743-b406-4379-9dcf-463473e05f1a
  keyVaultName: kv-paktech-prod
  workloadIdentityClientId: b83276aa-30fa-4667-b593-929a64f42d36   # terraform output app_identity_client_id
  secretPrefix: dev            # Key Vault secrets are named <prefix>-secret-key, <prefix>-postgres-password, ...

api:
  replicas: 1
  resources:
    requests: {cpu: 100m, memory: 192Mi}
    limits:   {memory: 512Mi}
  autoscaling: {enabled: true, minReplicas: 1, maxReplicas: 3, targetCPUUtilizationPercentage: 70}

web:
  replicas: 1
  resources:
    requests: {cpu: 50m, memory: 96Mi}
    limits:   {memory: 256Mi}

postgres:
  image: postgres:16-alpine
  storage: 5Gi
  storageClass: managed-csi
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits:   {memory: 512Mi}

redis:
  image: redis:7-alpine
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits:   {memory: 128Mi}

config:
  postgresDb: paktechchat
  postgresUser: chatuser
  aiModel: claude-sonnet-5-5
