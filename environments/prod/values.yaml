env: prod
host: paktechlimited.chat
gatewayListener: https-apex
hardening:
  readOnlyRootFilesystem: true
  disableTokenAutomount: true
networkPolicy:
  egress:
    enabled: true
azure:
  secretPrefix: prod
image:
  api: {tag: "d605c21", digest: "sha256:71dab55e8b28ee523a61ede2be50a607c09ca51c47e83d8baa1dcf9d5bfda3d6"}
  web: {tag: "d605c21", digest: "sha256:a2d2a146b1e9056289e9369e6730f50b218dea729b781f11c34784bb0879887e"}
api:
  replicas: 2
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 3, targetCPUUtilizationPercentage: 70}
web:
  replicas: 2

# Prometheus scraping of the api (PodMonitor and the allow-prometheus policy)
metrics:
  enabled: true
