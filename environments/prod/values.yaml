env: prod
host: paktechlimited.chat
gatewayListener: https-apex
hardening:
  readOnlyRootFilesystem: true
  disableTokenAutomount: true
networkPolicy:
  egress:
    enabled: true
azure:
  secretPrefix: prod
image:
  api: {tag: "7bedc25"}
  web: {tag: "7bedc25"}
api:
  replicas: 2
  autoscaling: {enabled: true, minReplicas: 2, maxReplicas: 3, targetCPUUtilizationPercentage: 70}
web:
  replicas: 2
