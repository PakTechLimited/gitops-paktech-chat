# Every image reference contains @sha256. Expect violations until CI writes digests (layer 3b).
# Starts in dryrun: violations are recorded on this object (kubectl get k8simagedigests image-digests -o yaml), nothing is rejected.
# Order of rollout: dryrun, then warn, then deny, once the audit list is empty.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sImageDigests
metadata:
  name: image-digests
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enforcementAction: warn
  match:
    kinds:
      - {apiGroups: [""], kinds: ["Pod"]}
    namespaces: [paktech-chat-dev, paktech-chat-staging, paktech-chat-prod]
