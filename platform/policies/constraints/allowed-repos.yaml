# Images only from our registry; postgres and redis come from Docker Hub until they are mirrored into the registry.
# Starts in dryrun: violations are recorded on this object (kubectl get k8sallowedrepos allowed-image-repos -o yaml), nothing is rejected.
# Order of rollout: dryrun, then warn, then deny, once the audit list is empty.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sAllowedRepos
metadata:
  name: allowed-image-repos
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enforcementAction: warn
  match:
    kinds:
      - {apiGroups: [""], kinds: ["Pod"]}
    namespaces: [paktech-chat-dev, paktech-chat-staging, paktech-chat-prod]
  parameters:
    repos:
      - "paktechacr.azurecr.io/"
      - "postgres:"
      - "redis:"
