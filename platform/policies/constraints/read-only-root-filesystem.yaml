# Every container sets readOnlyRootFilesystem: true. Expect violations until the chart change in layer 3 is applied.
# Starts in dryrun: violations are recorded on this object (kubectl get k8spspreadonlyrootfilesystem read-only-root-filesystem -o yaml), nothing is rejected.
# Order of rollout: dryrun, then warn, then deny, once the audit list is empty.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPReadOnlyRootFilesystem
metadata:
  name: read-only-root-filesystem
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enforcementAction: deny
  match:
    kinds:
      - {apiGroups: [""], kinds: ["Pod"]}
    namespaces: [paktech-chat-dev, paktech-chat-staging, paktech-chat-prod]
