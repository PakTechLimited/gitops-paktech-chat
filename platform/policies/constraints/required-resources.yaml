# Every container sets CPU and memory requests and a memory limit (no CPU limit on purpose, to avoid throttling).
# Starts in dryrun: violations are recorded on this object (kubectl get k8srequiredresources required-resources -o yaml), nothing is rejected.
# Order of rollout: dryrun, then warn, then deny, once the audit list is empty.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRequiredResources
metadata:
  name: required-resources
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enforcementAction: dryrun
  match:
    kinds:
      - {apiGroups: [""], kinds: ["Pod"]}
    namespaces: [paktech-chat-dev, paktech-chat-staging, paktech-chat-prod]
  parameters:
    limits: ["memory"]
    requests: ["cpu", "memory"]
