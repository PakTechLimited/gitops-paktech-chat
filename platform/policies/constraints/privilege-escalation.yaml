# allowPrivilegeEscalation must be false (the chart already sets it; this stops a future manifest from forgetting).
# Starts in dryrun: violations are recorded on this object (kubectl get k8spspallowprivilegeescalationcontainer no-privilege-escalation -o yaml), nothing is rejected.
# Order of rollout: dryrun, then warn, then deny, once the audit list is empty.
apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sPSPAllowPrivilegeEscalationContainer
metadata:
  name: no-privilege-escalation
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  enforcementAction: warn
  match:
    kinds:
      - {apiGroups: [""], kinds: ["Pod"]}
    namespaces: [paktech-chat-dev, paktech-chat-staging, paktech-chat-prod]
