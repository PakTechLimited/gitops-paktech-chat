# Phase 6: Envoy gateway proxy metrics (request counts and latency per route, including the web app).
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata: {name: envoy-proxy, namespace: monitoring}
spec:
  namespaceSelector: {matchNames: [envoy-gateway-system]}
  selector:
    matchLabels:
      app.kubernetes.io/name: envoy
      app.kubernetes.io/component: proxy
  podMetricsEndpoints:
    - {port: metrics, path: /stats/prometheus, interval: 30s}
