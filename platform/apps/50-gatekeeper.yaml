# Phase 5, layer 2: OPA Gatekeeper admission controller.
# This Application installs the engine only. Policies (templates and constraints) arrive in platform/policies,
# in report-only mode first. With no constraints installed, Gatekeeper rejects nothing.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gatekeeper
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "5"}
spec:
  project: platform
  # Same two AKS effects as cert-manager: the webhook CA is written after install, and the AKS Admissions Enforcer
  # adds namespaceSelector exclusions to every webhook. Ignoring just those fields avoids a permanent OutOfSync.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: gatekeeper-validating-webhook-configuration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - '.webhooks[]?.namespaceSelector.matchExpressions[]? | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
    - group: admissionregistration.k8s.io
      kind: MutatingWebhookConfiguration
      name: gatekeeper-mutating-webhook-configuration
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - '.webhooks[]?.namespaceSelector.matchExpressions[]? | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
  source:
    repoURL: https://open-policy-agent.github.io/gatekeeper/charts
    chart: gatekeeper
    targetRevision: 3.23.1                  # app v3.23.1; 3.24.0-beta.0 is a beta, not used
    helm:
      valuesObject:
        replicas: 1                          # lab: one controller replica. Production runs 3, spread across nodes.
        validatingWebhookFailurePolicy: Ignore   # fail open: if Gatekeeper is down the cluster keeps working
        controllerManager:
          exemptNamespaces:                  # never evaluated, so a policy mistake cannot block the platform
            - kube-system
            - gatekeeper-system
            - argocd
            - cert-manager
            - envoy-gateway-system
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
        audit:
          resources:
            requests: {cpu: 50m, memory: 128Mi}
            limits: {memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: gatekeeper-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
