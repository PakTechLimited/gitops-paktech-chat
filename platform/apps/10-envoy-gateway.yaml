apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: envoy-gateway
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-2"}
spec:
  project: platform
  source:
    repoURL: docker.io/envoyproxy
    chart: gateway-helm
    targetRevision: 1.10.0
    helm:
      valuesObject:
        deployment:
          envoyGateway:
            resources:
              requests: {cpu: 100m, memory: 128Mi}
              limits:   {memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: envoy-gateway-system
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]   # Gateway API CRDs are too large for client-side apply
