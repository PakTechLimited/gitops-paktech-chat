apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  project: platform
  # Two harmless fields differ from Git on every AKS cluster:
  #  - cainjector writes the webhook CA (caBundle) after install;
  #  - the AKS Admissions Enforcer adds namespaceSelector exclusions (control-plane, managedby=aks)
  #    to every webhook so a broken webhook can never block the system namespaces.
  # Ignoring just those fields stops a permanent OutOfSync without hiding real changes.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
        - '.webhooks[]?.namespaceSelector.matchExpressions[]? | select(.key == "control-plane" or .key == "kubernetes.azure.com/managedby")'
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds: {enabled: true}
        config:
          gatewayAPI: {enabled: true}              # watch Gateway resources and create Certificates from them
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits:   {memory: 256Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
