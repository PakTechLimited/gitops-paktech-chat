apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cert-manager
  namespace: argocd
  annotations: {argocd.argoproj.io/sync-wave: "-1"}
spec:
  project: platform
  # cert-manager's cainjector writes the webhook CA into this object after install, so it never
  # matches Git. Ignoring just that field stops a permanent, harmless OutOfSync.
  ignoreDifferences:
    - group: admissionregistration.k8s.io
      kind: ValidatingWebhookConfiguration
      name: cert-manager-webhook
      jqPathExpressions:
        - .webhooks[]?.clientConfig.caBundle
  source:
    repoURL: https://charts.jetstack.io
    chart: cert-manager
    targetRevision: v1.21.3
    helm:
      valuesObject:
        crds: {enabled: true}
        config:
          gatewayAPI: {enabled: true}              # watch Gateway resources and create Certificates from them
        resources:
          requests: {cpu: 25m, memory: 64Mi}
          limits:   {memory: 256Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  syncPolicy:
    automated: {prune: true, selfHeal: true}
    syncOptions: [CreateNamespace=true, ServerSideApply=true]