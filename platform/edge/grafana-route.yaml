# Public Grafana: login required (sign-up and anonymous access are off in the monitoring values).
# The route lives in the monitoring namespace, next to the Service it points at.
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana
  namespace: monitoring
spec:
  parentRefs:
    - {name: paktech-gateway, namespace: edge, sectionName: https-grafana}
  hostnames: [grafana.paktechlimited.chat]
  rules:
    - backendRefs:
        - {name: kube-prometheus-stack-grafana, port: 80}
