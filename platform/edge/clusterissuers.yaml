# Let's Encrypt staging first (no rate limits, untrusted certificate), then production.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: syedmuhammadalihaidry1994@gmail.com
    privateKeySecretRef: {name: letsencrypt-staging-account}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - {kind: Gateway, name: paktech-gateway, namespace: edge, sectionName: http}
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: syedmuhammadalihaidry1994@gmail.com
    privateKeySecretRef: {name: letsencrypt-prod-account}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - {kind: Gateway, name: paktech-gateway, namespace: edge, sectionName: http}
